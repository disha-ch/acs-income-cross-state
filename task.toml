schema_version = "1.3"
runtime_limits = 14400


[task]
name = "otter/acs-income-cross-state-shift"
description = "Train an ACSIncome classifier and evaluate its performance under geographic and post-2020 temporal distribution shift, including worst-state accuracy and calibration."

[metadata]
domain = "tabular-ml"
subdomain = "classification"
tags = ["acs-income", "tabular-classification", "distribution-shift", "calibration", "xgboost"]
source_dataset = "American Community Survey PUMS (ACSIncome via Folktables)"
source_url = "https://www.census.gov/programs-surveys/acs/microdata.html"
source_reference_id = "arxiv:2108.04884"
source_license = "Public Domain"

[source]
dataset_license = "Public Domain"

[environment]
build_timeout_sec = 1200.0
workdir = "/app"
os = "linux"
cpus = 8
memory_mb = 32768
storage_mb = 81920
# 0 for CPU-only tasks. Set to 1 for GPU tasks (single-GPU max — tasks are
# validated in single-container, single-GPU sandboxes) and switch
# environment/Dockerfile to a CUDA base image (see comments there).
gpus = 1
gpu_types = ["L4", "A100"]
allow_internet = true

[agent]
timeout_sec = 14400.0

[verifier]
timeout_sec = 900.0
